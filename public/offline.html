<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1628" />
    <title>Sem conexão · Arco</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #171717;
        --muted: #737373;
        --primary: #3b82f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a3a3a3;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.25rem; margin: 20px 0 8px; }
      p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin: 0 0 24px; }
      a {
        display: inline-block;
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Arco" width="72" height="72" />
      <h1>Você está sem conexão</h1>
      <p>Não foi possível carregar esta página. Verifique sua internet e tente novamente.</p>
      <a href="/dashboard">Tentar novamente</a>
    </main>
  </body>
</html>
